name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste API keys, tokens or other credentials.** Redact logs before posting.
        For security problems use the private reporting link in SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, config (with secrets removed), and the task IDs involved.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS and CPU (e.g. macOS arm64 / Rosetta, Linux x86_64, Windows WSL2), Docker version, Python version, `ceh` commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
