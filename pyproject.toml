[project]
name = "codeagent-eval-harness"
version = "0.0.1"
description = "Run coding agents on SWE-bench Verified Mini in Docker, score patches, and diff runs for regressions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Runtime dependencies are added by the spec that needs them.
dependencies = []

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceh"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon (run with --run-docker)"]
